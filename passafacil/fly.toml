# language: TOML, file: fly.toml
app = "passafacil" # Troque por um nome único se já existir
primary_region = "gru" # Região de São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Cria o disco para o banco de dados não sumir
[[mounts]]
  source = "passafacil_data"
  destination = "/data"